<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Payment History Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Payment History…<div class="bb-sub">Supabase user permissions</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v6.6.html?v=20260910-2',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Payment History source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-payment-history-adapter.js?v=20260910-2"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Payment History source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const marker='restore();';
    const replacement=`// SUPABASE AUTH CUTOVER
api=window.BBPaymentHistoryAdapter.api;
logout=async function(){
  await window.BBPaymentHistoryAdapter.signOut();
  location.reload();
};
(async function(){
  setup();
  try{
    await window.BBPaymentHistoryAdapter.ensureSession();
    const profile=await window.BBPaymentHistoryAdapter.profile();
    const isAdmin=!!profile?.user?.isAdmin || String(profile?.user?.role||'').toLowerCase()==='admin';
    ROLE=isAdmin?'admin':'salesman';
    sessionToken='SUPABASE:'+String(profile?.user?.userId||'user');
    deviceToken='';
    try{
      sessionStorage.removeItem('bb_ar_admin_session');
      sessionStorage.removeItem('bb_ar_salesman_session');
      localStorage.removeItem('bb_ar_admin_device');
      localStorage.removeItem('bb_ar_salesman_device');
    }catch(_){}
    $('loginOverlay').classList.add('hidden');
    $('logoutBtn').hidden=false;
    const cached=renderHistoryCache();
    if(cached)await smartSyncHistory(true);else await loadHistory();
    startHistorySmartSync();
  }catch(error){
    sessionToken='';deviceToken='';
    $('logoutBtn').hidden=true;
    $('loginOverlay').classList.remove('hidden');
    $('loginTitle').textContent='🔐 Supabase Sign In Required';
    $('loginText').textContent='Sign in to BIG BROTHER with an account that has access to this Payment History.';
    $('roleField').style.display='none';
    const codeField=$('code')?.closest('.field');if(codeField)codeField.style.display='none';
    const rememberRow=$('remember')?.closest('.remember');if(rememberRow)rememberRow.style.display='none';
    const signBtn=$('loginOverlay').querySelector('.btn.primary');if(signBtn)signBtn.style.display='none';
    err(error?.message||'Payment History access denied.');
  }
})();`;
    if(!html.includes(marker))throw new Error('Payment History initialization marker was not found.');
    html=html.replace(marker,replacement);
    html=html.replace('<title>BIG BROTHER - Payment History V6.6 Smart Sync Storage</title>','<title>BIG BROTHER — Payment History Supabase</title>');

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Payment History<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
